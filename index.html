function readForm(f,b){
  const v=Object.fromEntries(new FormData(f)),o={...b};
  for(const k of["status","date","method","fName"])if(k in v)o[k]=v[k];
  for(const k of["tIV","tQ","fIV","fQ","rIV","rQ","feroQty","feroPrice","foodPrice","fixed"])if(k in v)o[k]=v[k]===""?"":+v[k];
  for(const k of["feroBought","foodBought","dbl"])if(k in v)o[k]=v[k]==="Sim";
  /* só mexe nas stones quando o formulário realmente tem os campos delas (o modal de resultado não tem) */
  if(b.stones&&Object.keys(v).some(k=>k.startsWith("st_")))o.stones=b.stones.map((x,i)=>({type:v["st_type_"+i]!==undefined?v["st_type_"+i]:x.type,bought:v["st_bought_"+i]!==undefined?v["st_bought_"+i]==="Sim":!!x.bought,qty:v["st_qty_"+i]!==undefined?+v["st_qty_"+i]||0:x.qty,price:v["st_price_"+i]!==undefined?+v["st_price_"+i]||0:x.price}));
  return o;
}

function breedWarns(b,ok){
  const tq=+b.tQ,fq=+b.fQ,filled=tq>0&&fq>0&&+b.tIV>0&&+b.fIV>0;
  if(fq>0&&tq>0&&fq>tq&&!ok.q)return{title:"Qualidade da food maior que a do alvo",msg:"A food tem qualidade "+q3(fq)+", MAIOR que a do Pokémon alvo ("+q3(tq)+"). Isso costuma ser erro de digitação.",btns:[["Voltar e corrigir","wback",""],["Salvar mesmo assim","wq","pri"]]};
  if(b.status==="Não iniciado"&&filled&&!ok.s)return{title:"Mudar o status para Chocando?",msg:'Este breed está como "Não iniciado". Quer salvar como "Chocando"?',btns:[["Manter Não iniciado","wkeep",""],["Salvar como Chocando","wchoc","pri"]]};
  return null;
}
function trySaveBreed(){
  const m=ui.modal;ui.warn=null;const w=breedWarns(m.b,m.ok);
  if(w){ui.warn=w;return keepScroll()}
  const p=P(m.pid),b=m.b;
  if(b.method==="Grátis")b.feroBought=false;
  b.stones.forEach(x=>{if(!x.bought){x.qty=0;x.price=0}});
  if(m.edit)p.breeds=p.breeds.map(x=>x.id===b.id?b:x);else p.breeds.push(b);
  save();ui.modal=null;render();
}

document.addEventListener("submit",e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==="p"){const v=Object.fromEntries(new FormData(e.target));if(!v.name.trim())return;const d={name:v.name.trim(),startIV:+v.startIV||0,startQ:+v.startQ||0,stone:(v.stone||"").trim(),stone2:(v.stone2&&v.stone2!==v.stone?v.stone2:""),acc:(v.acc||"").trim()};
    if(ui.modal.edit)Object.assign(P(ui.modal.pid),d);else S.data.projects.push({id:uid(),...d,breeds:[]});save();ui.modal=null;return render()}
  const m=ui.modal,b=readForm(e.target,m.b);
  if(f==="b"){m.b=b;m.ok=m.ok||{};return trySaveBreed()}
  const p=P(m.pid);
  b.status="Finalizado";
  if(b.method==="Grátis")b.feroBought=false;
  if(m.edit)p.breeds=p.breeds.map(x=>x.id===b.id?b:x);else p.breeds.push(b);
  save();ui.modal=null;render();
});
