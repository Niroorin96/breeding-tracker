.gs{display:block;image-rendering:pixelated;background-repeat:no-repeat;flex:none}
.av:has(.gs){background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--gold) 18%,var(--bg)),var(--bg));border:2px solid var(--rim)}
.av.sm{width:44px;height:44px;font-size:18px}
/* toggle padrão: verde ligado, vermelho desligado */
.tg{display:flex;align-items:center;gap:9px;margin:8px 0 3px;font-size:13px;color:var(--tx);cursor:pointer;user-select:none;min-height:34px}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg .sw{position:relative;flex:none;width:40px;height:22px;background:var(--red);border:2px solid color-mix(in srgb,var(--red) 55%,#000);transition:background .15s}
.tg .sw:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;transition:left .15s}
.tg input:checked+.sw{background:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,#000)}
.tg input:checked+.sw:after{left:20px}
.tg input:focus-visible+.sw{outline:2px solid var(--gold);outline-offset:2px}
.tg.mini{margin:0;min-height:0;font-size:13px;color:var(--mu)}
.f3>.tg,.f2>.tg{align-self:end;margin-bottom:4px}
/* tabelas tipo planilha */
.wrap table{border:1px solid var(--line)}
.wrap th,.wrap td{border-right:1px solid var(--line)}
.wrap th:last-child,.wrap td:last-child{border-right:0}
.wrap th{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap td{overflow:hidden;text-overflow:ellipsis}
.rz{display:none}
@media(min-width:1024px) and (pointer:fine){
  .wrap table.rzt{table-layout:fixed}
  .rz{display:block;position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:2}
  .rz:hover,.rz.on{background:color-mix(in srgb,var(--gold) 45%,transparent)}
}
/* market */
.mkt{display:inline-block;font-size:11.5px;color:var(--mu);margin-top:3px}.mkt b{color:var(--gold);font-weight:500}
/* foods fabricadas */
.fabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:12px;margin-top:12px}
.fab{--cc:#2fd6c4;display:flex;flex-direction:column}
.fab .fh{display:flex;align-items:center;gap:10px}
.fab .fh b{font-family:"Pixelify Sans","DM Mono",monospace;font-size:16px}
.fab .kv{margin-top:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.fbt{display:flex;gap:4px;flex-wrap:nowrap}
.fab .fb{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.fab .fl{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.fr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.fr:last-child{border-bottom:0}
.fr .sp{flex:1}
.fst{font-size:11px;padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.fst.Disponível{color:var(--ok)}.fst.Chocando{color:var(--warn)}.fst.Usada{color:var(--mu)}
.ftag{display:inline-block;font-size:11px;padding:0 6px;margin-left:6px;border:1px solid #2fd6c4;color:#2fd6c4;vertical-align:middle}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
/* simulador */
.sim{--cc:#ffd23f}
.sim .simin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sim .kv{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sim .kv b{font-family:"Space Mono",ui-monospace,monospace;font-size:16px}
@media(max-width:640px){.sim .simin{grid-template-columns:1fr}.fabs{grid-template-columns:1fr}}
.fabsel{margin-top:6px}
input[readonly]{opacity:.75}
@media(max-width:560px){header{grid-template-columns:1fr}.hl{justify-content:center}.hr{justify-content:center;flex-wrap:wrap}}
</style>

<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
/* ===== Armazenamento (troque este adaptador por um backend para dados compartilhados na comunidade) ===== */
const Store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
/* ===== Nuvem (Supabase) =====
   Os dados do Supabase e os links do rodapé ficam no arquivo config.js (assim você atualiza o index.html sem mexer neles).
   Sem config.js ou com SB_URL vazio = o site funciona só no navegador. */
const CFG=window.PIW_CONFIG||{};
const SB_URL=CFG.SB_URL||"",SB_KEY=CFG.SB_KEY||"";
const CLOUD=!!(SB_URL&&SB_KEY);
if(CFG.BG_DARK)document.documentElement.style.setProperty("--bgd","url(\""+CFG.BG_DARK+"\")");
if(CFG.BG_LIGHT)document.documentElement.style.setProperty("--bgl","url(\""+CFG.BG_LIGHT+"\")");
async function rpc(fn,args){
  const h={"Content-Type":"application/json",apikey:SB_KEY};
  if(SB_KEY.startsWith("eyJ"))h.Authorization="Bearer "+SB_KEY;
  const r=await fetch(SB_URL.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}
const RAR=[[1,"Fraca","#8a8fa3"],[1.1,"Comum","#4caf7d"],[1.3,"Incomum","#3b8bdb"],[1.5,"Rara","#8e5bd9"],[1.7,"Épica","#d94fa8"],[2,"Lendária","#e8892b"],[3,"Mítica","#e5484d"],[4,"Anciã","#1fa3a3"],[99,"Divina","#d4a017"]];
const rar=q=>{q=+q;if(!q)return["–","#8a8fa3"];for(const[l,n,c]of RAR)if(q<l)return[n,c];return["Divina","#d4a017"]};
const rt=q=>{const[n,c]=rar(q);return`<span class="tag" style="background:${c}">${n}</span>`};
const fmt=n=>(+n||0).toLocaleString("pt-BR");
const q3=n=>(+n||0).toFixed(3);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd=n=>"$"+fmt(n);
const money=(l,k,v,x="")=>`<div><label>${l}</label><div class="mny"><span>$</span><input name="${k}" type="number" step="any" min="0" value="${esc(v)}" ${x}></div></div>`;
/* Fotos dos Pokémon.
   PIXEL=true deixa a imagem pixelada (32x32), parecida com a do jogo.
   Se descobrir o endereço das imagens do próprio jogo, preencha GAME_SPRITE, por exemplo:
   "https://poke.idleworld.online/assets/pokemon/{id}.png"   ({id} = número da Pokédex, {name} = nome em minúsculas) */
const PIXEL=false,GAME_SPRITE="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/{id}.png",PXM=GAME_SPRITE?"g":"o";
const IMG=Store.get("piw_img2")||{},PX=Store.get("piw_px")||{};
const slug=n=>String(n||"").trim().toLowerCase().replace(/♀/g,"-f").replace(/♂/g,"-m").replace(/[.'’:]/g,"").replace(/\s+/g,"-");
const spriteUrl=async k=>{const r=await fetch("https://pokeapi.co/api/v2/pokemon/"+encodeURIComponent(k));if(r.status===404)return"";if(!r.ok)throw 0;const j=await r.json();return(j.sprites.other&&j.sprites.other["official-artwork"].front_default)||j.sprites.front_default||""};
const srcOf=k=>{const u=IMG[k];if(!u)return"";if(GAME_SPRITE){const m=u.match(/\/(\d+)\.(png|gif)$/);return m?GAME_SPRITE.replace("{id}",m[1]).replace("{name}",k):u}return u};
/* reduz a imagem para 32x32, recorta as margens e deixa as bordas "serrilhadas" (pixel art) */
function pixelate(url){return new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";im.onerror=()=>res("");
  im.onload=()=>{try{
    const W=im.naturalWidth,H=im.naturalHeight,c0=document.createElement("canvas");c0.width=W;c0.height=H;const x0=c0.getContext("2d");x0.drawImage(im,0,0);
    let bx=0,by=0,bw=W,bh=H;
    try{const d=x0.getImageData(0,0,W,H).data;let a=W,b=H,c=0,e=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>20){if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>e)e=y}if(c>=a){bx=a;by=b;bw=c-a+1;bh=e-b+1}}catch(e){}
    const S=Math.max(bw,bh),M=96,m=document.createElement("canvas");m.width=m.height=M;const xm=m.getContext("2d");xm.imageSmoothingEnabled=true;xm.imageSmoothingQuality="high";
    const sc=(M-6)/S,dw=bw*sc,dh=bh*sc;xm.drawImage(im,bx,by,bw,bh,(M-dw)/2,(M-dh)/2,dw,dh);
    const N=32,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(m,0,0,N,N);
    const id=x.getImageData(0,0,N,N),d=id.data;for(let i=3;i<d.length;i+=4)d[i]=d[i]>110?255:0;x.putImageData(id,0,0);
    res(c.toDataURL("image/png"));
  }catch(e){res("")}};
  im.src=url})}
const imgTag=(u,n,px)=>{const fb=IMG[slug(n)]||"";return`<img class="${(px||GAME_SPRITE)?"px":""}" src="${esc(u)}" alt="${esc(n)}"${fb&&fb!==u?` data-fb="${esc(fb)}"`:""} onerror="var f=this.dataset.fb;if(f){this.removeAttribute('data-fb');this.classList.remove('px');this.src=f}else{this.parentNode.textContent=this.alt.charAt(0).toUpperCase()}">`};
/* Sprites e nomes do próprio jogo (game_species.json, gerado a partir do creatures.json e das folhas de sprite do jogo).
   Cada espécie guarda o recorte do sprite de frente: [arquivo, x, y, largura, altura, largura da folha, altura da folha]. */
const GAME_ASSETS="https://poke.idleworld.online/game/asset-packs/outfits/male/";
const nkey=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
let GSP=new Map();
async function loadGame(){try{const r=await fetch("game_species.json");if(!r.ok)throw 0;const j=await r.json();GSP=new Map(j.map(x=>[nkey(x.n),x]));NAMES=j.map(x=>x.n).sort((a,b)=>a.localeCompare(b));if(!ui.modal)render()}catch(e){loadNames()}}
const AVS={lg:160,sm:44,"":80};
function gsprite(n,box){const g=GSP.get(nkey(n));if(!g||!g.s)return"";const[f,x,y,w,h,pw,ph]=g.s,k=Math.max(1,Math.floor(box*.8/Math.max(w,h)*4)/4);
  return`<i class="gs" role="img" aria-label="${esc(n)}" style="width:${w*k}px;height:${h*k}px;background-image:url('${GAME_ASSETS}${f}');background-size:${pw*k}px ${ph*k}px;background-position:-${x*k}px -${y*k}px"></i>`}
const spr=(n,cls="")=>{const gs=gsprite(n,AVS[cls]||80);if(gs)return`<span class="av ${cls}">${gs}</span>`;const k=slug(n),px=PIXEL&&PX[k+PXM],u=px||srcOf(k);return`<span class="av ${cls}" data-pk="${esc(n)}">${u?imgTag(u,n,!!px):esc((n||"?").charAt(0).toUpperCase())}</span>`};
const busy={};
async function hydrate(){
  const ks=[...new Set([...document.querySelectorAll("[data-pk]")].filter(e=>!e.querySelector("img")).map(e=>slug(e.dataset.pk)))].filter(k=>k&&!busy[k]);
  for(const k of ks){busy[k]=1;
    try{
      if(IMG[k]===undefined){IMG[k]=await spriteUrl(k);Store.set("piw_img2",IMG)}
      const u=srcOf(k);
      if(u&&PIXEL&&PX[k+PXM]===undefined){PX[k+PXM]=await pixelate(u);Store.set("piw_px",PX)}
      const px=PIXEL&&PX[k+PXM],show=px||u;
      if(show)document.querySelectorAll("[data-pk]").forEach(e=>{if(slug(e.dataset.pk)===k)e.innerHTML=imgTag(show,e.dataset.pk,!!px)});
    }catch(x){}
    delete busy[k];
  }
}
/* Lista de nomes para os campos de Pokémon (PokeAPI; a Pokepedia carrega por JavaScript e não dá para ler direto) */
let NAMES=Store.get("piw_names")||[];
async function loadNames(){if(NAMES.length)return;try{const r=await fetch("https://pokeapi.co/api/v2/pokemon-species?limit=2000");const j=await r.json();NAMES=j.results.map(x=>x.name.split("-").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" "));Store.set("piw_names",NAMES)}catch(e){}}
const STONES=["Ancient Stone","Cocoon Stone","Crystal Stone","Darkness Stone","Earth Stone","Enigma Stone","Feather Stone","Fire Stone","Heart Stone","Ice Stone","Leaf Stone","Metal Stone","Punch Stone","Rock Stone","Thunder Stone","Venom Stone","Water Stone","Moon Stone","Sun Stone","Rough Gemstone"];
const stoneImg=n=>n?`<img class="sti" alt="" src="https://poke.idleworld.online/assets/items/${slug(n).replace(/-/g,"_")}.gif" onerror="this.style.display='none'">`:"";
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+" / "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const sha=async t=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return t}};

/* ===== Lógica da planilha ===== */
const stC=b=>(b.stones||[]).reduce((t,x)=>t+(x.bought?(+x.qty||0)*(+x.price||0):0),0);
const mig=d=>{d.projects.forEach(p=>{p.breeds.forEach(b=>{if(!b.stones){b.stones=[{type:b.stoneType||"Heart Stone",bought:!!b.stoneBought,qty:b.stoneQty||0,price:b.stonePrice||0}];delete b.stoneType;delete b.stoneBought;delete b.stoneQty;delete b.stonePrice}
  /* conserta breeds finalizados cuja stone perdeu o "comprada" ao salvar o resultado */
  if(b.status==="Finalizado")b.stones.forEach(x=>{if(!x.bought&&+x.qty>0&&+x.price>0)x.bought=true})});
  if(p.stone===undefined){p.stone=p.breeds.flatMap(b=>b.stones||[]).map(x=>x.type).find(Boolean)||""}
  if(p.stone)p.breeds.forEach(b=>(b.stones||[]).forEach(x=>{if(!x.type)x.type=p.stone}));
  if(!Array.isArray(p.fabs))p.fabs=[];p.fabs.forEach(f=>{if(!Array.isArray(f.breeds))f.breeds=[];f.breeds.forEach(b=>{if(!b.stones)b.stones=[]})})});return d};
const loadData=u=>{const raw=Store.get("piw_data_"+u);if(raw&&!Store.get("piw_bk2_"+u))Store.set("piw_bk2_"+u,raw);return mig(raw||{projects:[]})};
/* ===== Foods fabricadas =====
   Cada Pokémon alvo pode ter "fabs": foods que você mesmo sobe de qualidade para usar num breed do alvo.
   fab = {id, name, iv, q, bought, price, usedIn (id do breed do alvo que usou), breeds:[mesmo formato dos breeds]} */
const findFab=id=>{if(!id)return null;for(const p of S.data.projects)for(const f of p.fabs||[])if(f.id===id)return f;return null};
const F=(p,fid)=>(p.fabs||[]).find(f=>f.id===fid);
const L=(p,fid)=>fid?F(p,fid).breeds:p.breeds;
const baseCost=b=>(+b.fixed||0)+(b.method!=="Grátis"&&b.feroBought?(+b.feroQty||0)*(+b.feroPrice||0):0)+(b.foodBought?(+b.foodPrice||0):0)+stC(b);
const fabCur=f=>{const d=f.breeds.filter(b=>b.status==="Finalizado"&&+b.rQ);const l=d[d.length-1];return l?{iv:l.rIV,q:l.rQ}:{iv:f.iv,q:f.q}};
const fabCost=f=>(f.bought?(+f.price||0):0)+f.breeds.filter(b=>b.status==="Finalizado").reduce((s,b)=>s+baseCost(b),0);
const fabC=b=>{const f=b.fab&&findFab(b.fab);return f?fabCost(f):0};
const cost=b=>baseCost(b)+fabC(b);
const fabUsedBy=(p,f)=>f.usedIn?p.breeds.find(b=>b.id===f.usedIn&&b.fab===f.id):null;
const fabSt=(p,f)=>fabUsedBy(p,f)?"Usada":f.breeds.some(b=>b.status==="Chocando")?"Chocando":"Disponível";
/* custo das foods fabricadas que ainda não entraram num breed finalizado (entra no gasto total, fora da média por breed) */
const pendFab=p=>sum((p.fabs||[]).filter(f=>{const u=fabUsedBy(p,f);return!u||u.status!=="Finalizado"}).map(fabCost));
const done=p=>p.breeds.filter(b=>b.status==="Finalizado"&&+b.rQ);
const cur=p=>{const d=done(p);const l=d[d.length-1];return l?{iv:l.rIV,q:l.rQ}:{iv:p.startIV,q:p.startQ}};
const breedsCost=p=>p.breeds.filter(b=>b.status==="Finalizado").reduce((s,b)=>s+cost(b),0);
const totalCost=p=>breedsCost(p)+pendFab(p);
/* ===== Análises ===== */
const sum=a=>a.reduce((s,x)=>s+x,0),avg=a=>a.length?sum(a)/a.length:0,mnA=a=>a.length?Math.min(...a):0,mxA=a=>a.length?Math.max(...a):0;
const fin=p=>p.breeds.filter(b=>b.status==="Finalizado");
const finI=p=>p.breeds.map((b,i)=>({b,n:i+1})).filter(x=>x.b.status==="Finalizado");
const foodC=b=>b.foodBought?(+b.foodPrice||0):0;
const feroC=b=>b.method!=="Grátis"&&b.feroBought?(+b.feroQty||0)*(+b.feroPrice||0):0;
const addC=b=>foodC(b)+stC(b)+fabC(b);
const gainB=b=>Math.round(((+b.rQ||0)-(+b.tQ||0))*1000)/1000;
const gainsOf=bs=>bs.filter(b=>+b.rQ).map(gainB);
const catT=(bs,pend=0)=>({fix:sum(bs.map(b=>+b.fixed||0)),food:sum(bs.map(foodC)),st:sum(bs.map(stC)),fero:sum(bs.map(feroC)),fab:sum(bs.map(fabC))+pend});
const hist=gs=>{const m={};gs.forEach(g=>m[g]=(m[g]||0)+1);return Object.keys(m).map(k=>({g:+k,c:m[k]})).sort((a,b)=>a.g-b.g)};
const bestH=h=>h.length?h.reduce((a,x)=>x.g>a.g?x:a):null;
const commonH=h=>h.length?h.reduce((a,x)=>(x.c>a.c||(x.c===a.c&&x.g>a.g))?x:a):null;
const G=()=>{const ps=S.data.projects,rows=[];ps.forEach(p=>finI(p).forEach(x=>rows.push({p,b:x.b,n:x.n})));return{ps,rows}};
const pst=p=>[p.stone,p.stone2].filter(Boolean);
const stOf=(p,x)=>{const a=pst(p);return a.includes(x.type)?x.type:(a[0]||x.type||"")};
const stBuys=(p,t)=>{const r=[];p.breeds.forEach((b,i)=>(b.stones||[]).forEach(x=>{if(x.bought&&+x.price>0&&(!t||stOf(p,x)===t))r.push({n:i+1,qty:+x.qty||0,price:+x.price})}));return r};
const foodBuys=p=>p.breeds.map((b,i)=>({n:i+1,qty:1,price:+b.foodPrice||0,ok:b.foodBought})).filter(x=>x.ok&&x.price>0);
const pstat=(r,w)=>{if(!r.length)return{n:0};const ps=r.map(x=>x.price),wq=w&&r.some(x=>x.qty>0),q=wq?sum(r.map(x=>x.qty)):r.length,tot=sum(r.map(x=>(wq?x.qty:1)*x.price));return{n:r.length,min:Math.min(...ps),max:Math.max(...ps),avg:Math.round(tot/q),last:r[r.length-1].price}};
const CH_FREE=[[.5,.005],[.35,.010],[.12,.020],[.03,.040]],CH_FERO=[[.5,.15],[.3,.20],[.15,.25],[.05,.30]];

const LINK_CONTATO=CFG.LINK_CONTATO||"https://exemplo.com/contato";
const VERSION="v2.2.0";
const foot=()=>`<footer class="ft">Desenvolvido por Niroo · <a href="${LINK_CONTATO}" target="_blank" rel="noopener">Contato</a></footer>`;
let S={user:null,data:{projects:[]}},ui={modal:null,err:"",hideDone:!!Store.get("piw_hide"),hideAn:!!Store.get("piw_hideAn"),hideSim:!!Store.get("piw_hideSim")};
const isDark=()=>{const t=document.documentElement.getAttribute("data-theme");return t?t==="dark":true};
const SYNC={ok:"☁ salvo",saving:"☁ salvando…",err:"⚠ sem conexão — salvo só neste aparelho",auth:"⚠ sessão expirada — saia e entre de novo"};
function setSync(k){S.sync=k;const e=document.getElementById("syncst");if(e)e.textContent=CLOUD?(SYNC[k]||""):""}
let _pt=null,_ver=0;
const save=()=>{Store.set("piw_data_"+S.user,S.data);if(CLOUD&&S.token){_ver++;S.dirty=1;setSync("saving");clearTimeout(_pt);_pt=setTimeout(push,600)}};
async function push(){
  if(!CLOUD||!S.token)return;const v=_ver;
  try{const r=await rpc("piw_save",{p_nick:S.user,p_token:S.token,p_data:S.data});
    if(r.status==="ok"){S.rev=r.updated_at;if(v===_ver){S.dirty=0;setSync("ok")}else push()}else setSync("auth")}
  catch(e){setSync("err")}
}
window.addEventListener("online",()=>{if(S.dirty)push()});
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!CLOUD||!S.token||S.dirty||ui.modal)return;
  try{const r=await rpc("piw_load",{p_nick:S.user,p_token:S.token});
    if(r.status==="ok"&&r.updated_at!==S.rev){S.rev=r.updated_at;S.data=mig(r.data||{projects:[]});Store.set("piw_data_"+S.user,S.data);render()}}catch(e){}
});
const P=id=>S.data.projects.find(p=>p.id===id);

const getSess=()=>{try{const v=JSON.parse(localStorage.getItem("piw_session")||sessionStorage.getItem("piw_session"));return typeof v==="string"?{n:v}:v}catch(e){return null}};
const clearSess=()=>{try{localStorage.removeItem("piw_session");sessionStorage.removeItem("piw_session")}catch(e){}};
const setSess=(o,rem)=>{try{const v=JSON.stringify(o);if(rem){localStorage.setItem("piw_session",v);sessionStorage.removeItem("piw_session");localStorage.setItem("piw_lastnick",JSON.stringify(o.n))}else{sessionStorage.setItem("piw_session",v);localStorage.removeItem("piw_session");localStorage.removeItem("piw_lastnick")}}catch(e){}};
async function login(nick,pin,rem){
  nick=nick.trim().toLowerCase();ui.nick=nick;ui.rem=rem;
  if(!nick||!/^\d{4}$/.test(pin)){ui.err="Informe o nick e um PIN de 4 dígitos.";return render()}
  if(!CLOUD){
    const users=Store.get("piw_users")||{},h=await sha(nick+":"+pin);
    if(users[nick]&&users[nick]!==h){ui.err="PIN incorreto para este nick.";return render()}
    if(!users[nick]){users[nick]=h;Store.set("piw_users",users)}
    S.user=nick;S.data=loadData(nick);save();setSess({n:nick},rem);ui.err="";location.hash="#/";return render();
  }
  const el=document.querySelector(".err");if(el)el.textContent="Conectando…";
  try{
    let r=await rpc("piw_login",{p_nick:nick,p_pin:pin});
    if(r.status==="new"){
      const loc=Store.get("piw_data_"+nick),init=(loc&&Array.isArray(loc.projects))?loc:{projects:[]};
      const g=await rpc("piw_register",{p_nick:nick,p_pin:pin,p_data:init});
      if(g.status!=="ok"){ui.err=g.status==="exists"?"Esse nick já existe. Confira o PIN.":"Não foi possível criar a conta.";return render()}
      r={status:"ok",token:g.token,data:init,updated_at:g.updated_at};
    }
    if(r.status==="bad_pin"){ui.err="PIN incorreto."+(r.left!=null?" Tentativas restantes: "+r.left+".":"");return render()}
    if(r.status==="locked"){ui.err="Muitas tentativas erradas. Tente de novo em alguns minutos.";return render()}
    if(r.status!=="ok"){ui.err="Não foi possível entrar.";return render()}
    S.user=nick;S.token=r.token;S.rev=r.updated_at;S.data=mig(r.data||{projects:[]});S.dirty=0;
    Store.set("piw_data_"+nick,S.data);setSess({n:nick,t:r.token},rem);ui.err="";location.hash="#/";setSync("ok");render();
    /* conta vazia na nuvem, mas com dados antigos neste aparelho: oferece enviar */
    const loc=Store.get("piw_bk2_"+nick)||null;
    if(!(S.data.projects||[]).length&&loc&&Array.isArray(loc.projects)&&loc.projects.length&&confirm("Encontrei dados salvos neste aparelho. Enviar para a nuvem?")){S.data=mig(loc);save();render()}
  }catch(e){ui.err="Sem conexão com o servidor. Tente novamente.";render()}
}
const logout=()=>{clearSess();S.user=null;S.token=null;render()};

const MK_URL=CFG.MARKET_URL||"",MK_KEY=CFG.MARKET_KEY||"",MKT=!!(MK_URL&&MK_KEY);let _mk={k:"",at:0,d:null};
const mkBase=()=>MK_URL.trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,"");
async function fillMkt(){if(!MKT)return;const m=ui.modal,p=P(m.pid);if(!p)return;const b=m.b,fq=toN(b.tQ),sp=(m.fid?F(p,m.fid).name:p.name);
  const key=[pst(p).join(","),sp,q3(fq)].join("|");
  if(_mk.k!==key||Date.now()-_mk.at>120000){try{const h={"Content-Type":"application/json",apikey:MK_KEY};if(MK_KEY.startsWith("eyJ"))h.Authorization="Bearer "+MK_KEY;
    const r=await fetch(mkBase()+"/rest/v1/rpc/bt_prices",{method:"POST",headers:h,body:JSON.stringify({p_stones:pst(p),p_species:sp,p_qmin:Math.max(0,fq-MAXDIF),p_qmax:fq})});

  const d=_mk.d||{},put=(k,v)=>document.querySelectorAll(`[data-mk="${k}"]`).forEach(e=>e.innerHTML=v);
  for(const t of pst(p)){const v=d.stones&&d.stones[t];put("st:"+t,v?`market agora <b>${usd(v)}</b>`:"")}

}

(async()=>{
  const q=getSess();
  if(q&&q.n){
    if(!CLOUD){S.user=q.n;S.data=loadData(q.n);save()}
    else if(q.t){
      try{const r=await rpc("piw_load",{p_nick:q.n,p_token:q.t});
        if(r.status==="ok"){S.user=q.n;S.token=q.t;S.rev=r.updated_at;S.data=mig(r.data||{projects:[]});Store.set("piw_data_"+q.n,S.data);S.sync="ok"}
        else clearSess()}
      catch(e){const loc=Store.get("piw_data_"+q.n);if(loc){S.user=q.n;S.token=q.t;S.data=mig(loc);S.sync="err"}}
    }else clearSess();
  }
  render();loadGame();
})();
